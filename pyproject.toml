[project]
name = "bdh-spam-filter"
version = "0.1.0"
description = "Email spam filter using the Baby Dragon Hatchling (BDH-GPU) architecture with continuous learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3.0",
    "numpy>=1.26.0",
    "requests>=2.32.0",
    "tqdm>=4.67.0",
    "datasets>=2.20.0",
    "optuna>=4.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
